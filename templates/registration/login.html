{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}
login
{% endblock title %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h3>Login</h3>
            <form method="POST" autocomplete="off">
                {% csrf_token %}
                {{form|crispy}}
                <input type="hidden" name="next" value="{{next}}">
                <button type="submit" class="btn btn-primary mt-2">login</button>
            </form>
        </div>
    </div>
{% endblock content %}
