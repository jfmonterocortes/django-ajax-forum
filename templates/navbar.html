<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'posts:main-board' %}">Posts-proj</a>
        {% if request.user.is_authenticated %}
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'posts:main-board' %}">Home</a>
                <a class="nav-link" href="{% url 'profiles:my-profile' %}">My profile</a>
                {% if request.user.is_staff %}
                    <a class="nav-link" href="/admin/">Admin</a>
                {% endif %}
                <span class="nav-link text-white">{{request.user.username}}</span>
                <form action="{% url 'logout' %}" method="POST" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-link nav-link">Logout</button>
                </form>
            </div>
        {% endif %}
    </div>
</nav>
